name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - run: dennice --help
      - run: python -c 'from importlib.resources import files; assert files("dennice.routing").joinpath("routing_decision.schema.json").is_file(); assert any(p.name.endswith(".md") for p in files("dennice.cognition.policies").iterdir()); assert all(files("dennice.benchmark.builtin_tasks").joinpath("fixtures", name).is_file() for name in ("query_history.csv", "warehouse_history.csv", "run_results.json"))'
      - run: python -m pytest -q -W error::pytest.PytestUnraisableExceptionWarning
